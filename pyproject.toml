[project]
name = "painel-do-leao"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # só o que a função Python da Vercel precisa (api/ + pipeline/model)
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]
pipeline = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
    "tzdata>=2026.4",
]

[tool.uv]
default-groups = "all"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
