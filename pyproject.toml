[project]
name = "painel-do-leao"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
api = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]
dev = [
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]
pipeline = [
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
]

[tool.uv]
default-groups = "all"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
